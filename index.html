          "name": "如何查詢可疑訊息是否為詐騙？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "直接將可疑訊息、網址或電話號碼貼入 verify1st.tw 的查詢框，AI 會自動辨識並整合多個資安資料庫（VirusTotal、Google 安全瀏覽、ScamSniffer）給出詐騙風險評估。"
          }
        },
        {
          "@type": "Question",
          "name": "如何辨識釣魚網站？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "釣魚網站常見特徵：域名拼字相似（如 g00gle.com）、網站剛建立不久、要求輸入帳號密碼或轉帳。可將網址貼入 verify1st.tw 即時查詢域名年齡與安全紀錄。"
          }
        },
        {
          "@type": "Question",
          "name": "投資詐騙有哪些警訊？",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "常見警訊包括：保證獲利、老師帶單、穩賺不賠、限時優惠、要求加 LINE 或 Telegram 私訊、索取轉帳或加密貨幣。若收到類似訊息，請先透過 verify1st.tw 查詢，或撥打 165 反詐騙專線。"
